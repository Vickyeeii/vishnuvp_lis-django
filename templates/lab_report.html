{% extends 'base.html' %} {% block content %}

<h1 class="page-title d-print-none">Clinical Lab Reports</h1>

<!-- Search Bar for Clinicians -->
<div class="form-card mb-4 d-print-none" style="padding: 20px">
  <div
    class="form-card-title"
    style="
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    "
  >
    Search Patient History / Reports
  </div>
  <form id="searchForm" class="row g-2">
    <div class="col-md-9 col-8">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Search by Patient Name or MRN (Medical Record Number)..."
      />
    </div>
    <div class="col-md-3 col-4">
      <button
        class="btn-premium btn-premium-primary w-100"
        style="padding: 10px"
        type="submit"
      >
        Query Database
      </button>
    </div>
  </form>
</div>

<div class="d-print-none mb-4">
  <p style="font-size: 0.85rem; color: var(--text-secondary)">
    Below is a summary of finalized completed laboratory reports.
  </p>
</div>

<div class="table-wrapper d-print-none">
  <div class="table-responsive">
    <table class="table-premium">
      <thead>
        <tr>
          <th>Order #</th>
          <th>Patient Name (MRN)</th>
          <th>Physician</th>
          <th>Collection Date</th>
          <th style="text-align: right">Action</th>
        </tr>
      </thead>
      <tbody id="reports-tbody">
        <tr>
          <td
            colspan="5"
            style="
              text-align: center;
              color: var(--text-secondary);
              padding: 32px;
            "
          >
            Loading reports...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Detailed Report Modal -->
<div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div
      class="modal-content"
      style="
        background-color: var(--bg-primary);
        border: 1px solid var(--border-color);
      "
    >
      <div
        class="modal-header d-print-none d-flex align-items-center justify-content-between"
        style="border-bottom: 1px solid var(--border-color)"
      >
        <h5
          class="modal-title"
          style="color: var(--text-primary); font-weight: 600; margin-bottom: 0"
        >
          Detailed Clinical Report
        </h5>
        <div class="d-flex align-items-center">
          <button
            class="btn-premium btn-premium-primary d-flex align-items-center"
            style="
              padding: 6px 14px;
              font-size: 0.8rem;
              font-weight: 500;
              margin-right: 16px;
              gap: 6px;
            "
            onclick="window.print()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 6 2 18 2 18 9" />
              <path
                d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
              />
              <rect x="6" y="14" width="12" height="8" />
            </svg>
            Print as PDF
          </button>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
            style="
              filter: invert(1) grayscale(100%) brightness(200%);
              margin: 0;
            "
          ></button>
        </div>
      </div>
      <div class="modal-body" id="reportModalBody" style="padding: 0">
        <!-- Report content injected via JS -->
      </div>
    </div>
  </div>
</div>

<style>
  /* CSS to ensure ONLY the modal prints, hiding everything else on the page */
  @media print {
    body * {
      visibility: hidden;
    }
    #reportModal,
    #reportModal * {
      visibility: visible;
    }
    #reportModal {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .modal-dialog {
      max-width: 100%;
      margin: 0;
    }
    .modal-content {
      border: none;
      box-shadow: none;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const tbody = document.getElementById("reports-tbody");
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const modalBody = document.getElementById("reportModalBody");
    let loadedOrders = [];

    // Parse URL for ?search=
    const urlParams = new URLSearchParams(window.location.search);
    const initialSearch = urlParams.get("search") || "";
    if (initialSearch) {
      searchInput.value = initialSearch;
    }

    // Global function for the View button click
    window.viewReport = function (orderId) {
      const order = loadedOrders.find((o) => o.id === orderId);
      if (!order) return;

      // Generate full report card HTML
      const patientName =
        order.patient_name ||
        `${order.patient?.first_name} ${order.patient?.last_name}`;
      const mrn = order.patient?.mrn || "N/A";
      const gender = order.patient?.gender
        ? order.patient.gender.charAt(0).toUpperCase() +
          order.patient.gender.slice(1)
        : "N/A";
      const phone = order.patient?.phone_number || "N/A";
      const condition = order.sample?.sample_condition || "N/A";
      const conditionHtml =
        condition === "good"
          ? `<span style="color: var(--success); font-weight: 600;">Good</span>`
          : `<span style="color: var(--warning); font-weight: 600;">${condition.charAt(0).toUpperCase() + condition.slice(1)}</span>`;

      let collectionDate = "—";
      if (order.sample && order.sample.collection_date) {
        const d = new Date(order.sample.collection_date);
        collectionDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }

      const resultsHtml = (order.results || [])
        .map((r) => {
          let flagHtml = `<span class="badge-premium badge-priority-normal1">Normal</span>`;
          if (r.flag === "critical")
            flagHtml = `<span class="badge-premium badge-priority-stat">Critical</span>`;
          else if (r.flag === "high")
            flagHtml = `<span class="badge-premium badge-priority-stat">High</span>`;
          else if (r.flag === "low")
            flagHtml = `<span class="badge-premium badge-priority-lowb">Low</span>`;

          return `
        <tr>
          <td><span class="code-mrn">${r.test_name.substring(0, 3).toUpperCase()}-XX</span></td>
          <td>${r.test_name}</td>
          <td><strong style="color: var(--accent-blue); font-family: monospace; font-size: 0.9rem;">${r.result_value}</strong></td>
          <td>${flagHtml}</td>
          <td><span style="color: var(--text-secondary); font-size: 0.82rem; font-style: italic;">${r.remarks || "—"}</span></td>
        </tr>
      `;
        })
        .join("");

      let signOff = "";
      if (order.results && order.results.length > 0) {
        const firstR = order.results[0];
        let compDate = "—";
        if (firstR.created_at) {
          const d = new Date(firstR.created_at);
          compDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
        }
        signOff = `
        <div style="font-weight: 600; color: var(--text-primary);">${firstR.entered_by_name || "Technician"}</div>
        <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px;">Completed At: ${compDate}</div>
      `;
      }

      modalBody.innerHTML = `
      <div class="report-card" style="margin: 0; box-shadow: none; border: none; border-radius: 0;">
        <div class="report-header">
          <h5 style="margin-bottom: 0; font-size: 1.05rem; font-weight: 600; color: var(--text-primary);">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-blue); vertical-align: middle; margin-right: 6px;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Lab Report — Order #${order.id}</span>
          </h5>
        </div>
        
        <div class="report-body">
          <div class="report-section-title">Patient Demographics</div>
          <div class="demographics-grid">
            <div class="demographics-item">
              <span class="demographics-label">MRN</span>
              <span class="demographics-value" style="font-family: monospace;"><span class="code-mrn">${mrn}</span></span>
            </div>
            <div class="demographics-item">
              <span class="demographics-label">Patient Name</span>
              <span class="demographics-value" style="font-weight: 600;">${patientName}</span>
            </div>
            <div class="demographics-item">
              <span class="demographics-label">Gender</span>
              <span class="demographics-value">${gender}</span>
            </div>
            <div class="demographics-item">
              <span class="demographics-label">Phone Number</span>
              <span class="demographics-value">${phone}</span>
            </div>
          </div>

          <div class="report-section-title">Clinical Details</div>
          <div class="demographics-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 28px;">
            <div class="demographics-item">
              <span class="demographics-label">Ordering Physician</span>
              <span class="demographics-value">Dr. ${order.physician_name}</span>
            </div>
            <div class="demographics-item">
              <span class="demographics-label">Sample Condition</span>
              <span class="demographics-value">${conditionHtml}</span>
            </div>
            <div class="demographics-item">
              <span class="demographics-label">Collection Date</span>
              <span class="demographics-value">${collectionDate}</span>
            </div>
          </div>

          <div class="report-section-title">Consolidated Laboratory Findings</div>
          <div class="table-responsive" style="border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 28px;">
            <table class="findings-table" style="margin-bottom: 0;">
              <thead>
                <tr>
                  <th>Test Code</th>
                  <th>Test Name</th>
                  <th>Result Value</th>
                  <th>Flag</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody>
                ${resultsHtml}
              </tbody>
            </table>
          </div>

          <div class="report-footer">
            <div class="report-notes">
              <span class="demographics-label" style="display: block; margin-bottom: 6px;">Clinical Notes</span>
              <p style="color: var(--text-secondary); font-size: 0.84rem; font-style: italic; line-height: 1.5; margin: 0;">${order.clinical_notes || "Fever and vomiting in 3 days."}</p>
            </div>
            <div class="report-signoff">
              <span class="demographics-label" style="display: block; margin-bottom: 6px;">Final Laboratory Sign-off</span>
              ${signOff}
            </div>
          </div>
        </div>
      </div>
    `;

      // Show modal using Bootstrap JS API
      const modalEl = document.getElementById("reportModal");
      const modal = new bootstrap.Modal(modalEl);
      modal.show();
    };

    const fetchReports = async (searchQuery = "") => {
      tbody.innerHTML =
        '<tr><td colspan="5" style="text-align: center; padding: 48px; color: var(--text-secondary);">Loading reports...</td></tr>';

      try {
        const url = `/api/v1/orders/?status=4&detailed=true&search=${encodeURIComponent(searchQuery)}`;
        const res = await api.get(url);

        if (res.success) {
          loadedOrders = res.data.results || res.data;

          if (loadedOrders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 48px; color: var(--text-secondary);">No completed lab reports match your current query.</td></tr>`;
            return;
          }

          tbody.innerHTML = loadedOrders
            .map((order) => {
              const patientName =
                order.patient_name ||
                `${order.patient?.first_name} ${order.patient?.last_name}`;
              const mrn = order.patient?.mrn || "N/A";

              let collectionDate = "—";
              if (order.sample && order.sample.collection_date) {
                const d = new Date(order.sample.collection_date);
                collectionDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
              }

              return `
            <tr>
              <td><strong>#${order.id}</strong></td>
              <td>
                <span class="code-mrn" style="margin-right: 8px;">${mrn}</span> 
                <strong style="color: var(--text-primary); font-weight: 600;">${patientName}</strong>
              </td>
              <td>Dr. ${order.physician_name}</td>
              <td>${collectionDate}</td>
              <td style="text-align: right;">
                <button onclick="viewReport(${order.id})" class="btn-premium btn-premium-secondary" style="padding: 4px 12px; font-size: 0.8rem;">
                  View Report
                </button>
              </td>
            </tr>
          `;
            })
            .join("");
        } else {
          tbody.innerHTML =
            '<tr><td colspan="5" style="color: var(--danger); text-align: center; padding: 48px;">Error loading reports.</td></tr>';
        }
      } catch (err) {
        console.error(err);
        tbody.innerHTML =
          '<tr><td colspan="5" style="color: var(--danger); text-align: center; padding: 48px;">Network error.</td></tr>';
      }
    };

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      fetchReports(searchInput.value);
    });

    // Initial fetch using query param if present
    fetchReports(initialSearch);
  });
</script>

{% endblock %}
