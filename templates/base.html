{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIS — Laboratory Information System</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (Optional Grid Support) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Premium Minimalist Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/layout.css' %}" />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <link rel="stylesheet" href="{% static 'css/forms.css' %}" />
    <link rel="stylesheet" href="{% static 'css/tables.css' %}" />
    <link rel="stylesheet" href="{% static 'css/reports.css' %}" />
  </head>
  <body>
    <div class="app-container">
      <!-- Included Sidebar Partial Component -->
      {% include 'partials/sidebar.html' %}

      <!-- Flexible Main Content Area -->
      <main class="content-wrapper">
        <!-- Included Top Navbar Partial Component -->
        {% include 'partials/navbar.html' %}

        <div class="content-container">
          <!-- Include Dynamic System Alerts Component -->
          {% include 'partials/alerts.html' %}

          <!-- Template Page Content Injection Block -->
          {% block content %} {% endblock %}
        </div>
      </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API Utility for Fetch requests -->
    <script src="{% static 'js/api.js' %}"></script>

    <!-- Premium Mobile Sidebar Handling Script -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const toggleBtn = document.getElementById("mobileToggleBtn");
        const closeBtn = document.getElementById("sidebarCloseBtn");
        const sidebar = document.getElementById("sidebarPanel");

        if (toggleBtn && sidebar) {
          toggleBtn.addEventListener("click", function() {
            sidebar.classList.add("active");
          });
        }

        if (closeBtn && sidebar) {
          closeBtn.addEventListener("click", function() {
            sidebar.classList.remove("active");
          });
        }

        // Close sidebar if user clicks outside of it on smaller screens
        document.addEventListener("click", function(event) {
          const isClickInside = sidebar.contains(event.target) || (toggleBtn && toggleBtn.contains(event.target));
          if (!isClickInside && sidebar && sidebar.classList.contains("active")) {
            sidebar.classList.remove("active");
          }
        });

        // Enterprise Loading State interceptor on form submit
        const forms = document.querySelectorAll("form");
        forms.forEach(form => {
          form.addEventListener("submit", function() {
            const btn = this.querySelector("button[type='submit']");
            if (btn && !btn.hasAttribute('onclick')) {
              btn.style.opacity = "0.7";
              btn.style.pointerEvents = "none";
              btn.innerHTML = `
                <svg style="animation: rotate 2s linear infinite; width:14px; height:14px; margin-right: 6px;" viewBox="0 0 24 24"><circle style="stroke: currentColor; stroke-linecap: round; animation: dash 1.5s ease-in-out infinite;" cx="12" cy="12" r="10" fill="none" stroke-width="3"></circle></svg>
                Processing...
              `;
            }
          });
        });
      });
    </script>
  </body>
</html>
